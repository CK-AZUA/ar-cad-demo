<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>AR.js + Draco Monkey-Patch</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <script>
    (function(){
      // 2a) Prepare one shared DracoLoader
      const dracoPath = 'https://www.gstatic.com/draco/v1/decoders/';
      const dracoLoader = new THREE.DRACOLoader();
      dracoLoader.setDecoderPath(dracoPath);

      // 2b) Hold onto the original class
      const OriginalGLTFLoader = THREE.GLTFLoader;

      // 2c) Replace THREE.GLTFLoader with our wrapper
      THREE.GLTFLoader = function(manager){
        // instantiate the original loader
        const loader = new OriginalGLTFLoader(manager);
        // inject the Draco loader
        loader.setDRACOLoader(dracoLoader);
        return loader;
      };
      // keep its prototype so instances still work
      THREE.GLTFLoader.prototype = OriginalGLTFLoader.prototype;

      console.log('Globally patched THREE.GLTFLoader with Draco from', dracoPath);
    })();
  </script>

  <style> body { margin:0; overflow:hidden } </style>
</head>
<body>
  <a-assets>
    <img id="qr-marker-img" src="pattern-hiro.png">
  </a-assets>

  <a-scene
    embedded
    vr-mode-ui="enabled:false"
    renderer="logarithmicDepthBuffer:true"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <a-marker type="pattern" url="pattern-hiro.patt">
      <a-entity
        id="model"
        gltf-model="models/ColorCorrect.glb"
        scale="2.8 2.8 2.8"
        rotation="0 0 0"
      ></a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
