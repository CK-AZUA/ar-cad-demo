<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>AR.js – Responsive Camera + Transparent Model Layer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- A-Frame & AR.js -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    .arjs-loader {
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .arjs-loader div {
        text-align: center;
        font-size: 1.25em;
        color: white;
      }
  </style>
</head>
<body>
  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam;debugUIEnabled: false;"
  >
    <!-- Hiro marker -->
    <a-marker id="marker" preset="hiro" emitevents="true">
      <!-- Your CAD model -->
      <a-entity
        gltf-model="models/my-cad-model-2.glb"
        scale="1 1 1"
        rotation="0 0 0"
      ></a-entity>
    </a-marker>

    <!-- Camera -->
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Once the scene is ready...
    document.querySelector('a-scene').addEventListener('loaded', () => {
      const marker = document.getElementById('marker');
      const model  = document.getElementById('model');
      const scene  = document.querySelector('a-scene');

      marker.addEventListener('markerFound', () => {
        // Only detach once
        if (model.parentNode === marker) {
          // Compute world transform of the model
          model.object3D.updateMatrixWorld(true);
          const worldPos   = new THREE.Vector3();
          const worldQuat  = new THREE.Quaternion();
          const worldScale = new THREE.Vector3();
          model.object3D.matrixWorld.decompose(worldPos, worldQuat, worldScale);

          // Remove from marker and append to scene
          marker.removeChild(model);
          scene.appendChild(model);

          // Apply the world transform as the model's local transform
          model.object3D.position.copy(worldPos);
          model.object3D.quaternion.copy(worldQuat);
          model.object3D.scale.copy(worldScale);
        }
      });
    });
  </script>
</body>
</html>
